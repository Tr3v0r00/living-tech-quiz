<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Technology: Tools Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Cyberpunk / Holographic Theme */
        :root {
            --primary-glow: #00e5ff;
            --secondary-glow: #ff00ea;
            --bg-color: #050510;
            --panel-bg: rgba(10, 15, 30, 0.75);
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            perspective: 1000px;
        }

        /* --- Floating & Moving Background Designs --- */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            background: radial-gradient(circle at center, #111122 0%, var(--bg-color) 100%);
        }

        .shape {
            position: absolute;
            border: 2px solid rgba(0, 229, 255, 0.15);
            border-radius: 50%;
            animation: float-shape 20s infinite linear;
        }

        .shape-1 { width: 300px; height: 300px; top: -50px; left: -100px; border-style: dashed; animation-duration: 25s; }
        .shape-2 { width: 500px; height: 500px; bottom: -150px; right: -100px; border-color: rgba(255, 0, 234, 0.1); animation-direction: reverse; }
        .shape-3 { width: 150px; height: 150px; top: 40%; left: 80%; border-radius: 10px; transform: rotate(45deg); animation: float-cube 15s infinite ease-in-out; border-color: rgba(0, 229, 255, 0.2); }
        .shape-4 { width: 200px; height: 200px; top: 20%; left: 10%; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; border-color: rgba(255, 0, 234, 0.15); animation: morph-shape 15s infinite ease-in-out; }

        @keyframes float-shape {
            0% { transform: rotate(0deg) translate(0, 0); }
            50% { transform: rotate(180deg) translate(30px, 30px); }
            100% { transform: rotate(360deg) translate(0, 0); }
        }
        @keyframes float-cube {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50% { transform: rotate(90deg) translateY(-40px); }
        }
        @keyframes morph-shape {
            0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: translateY(0) rotate(0deg); }
            50% { border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%; transform: translateY(-30px) rotate(45deg); }
        }

        /* --- New Floating Tools Background (Quiz) --- */
        #floating-tools {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 1s ease;
        }
        .float-tool {
            position: absolute;
            color: var(--primary-glow);
            opacity: 0.12;
            animation: floatUp linear infinite;
        }
        .float-tool:nth-child(even) { color: var(--secondary-glow); }
        
        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(360deg); }
        }

        /* --- Login Form Scanner --- */
        .login-scanner {
            position: absolute;
            width: 100%;
            height: 3px;
            background: var(--primary-glow);
            box-shadow: 0 0 15px var(--primary-glow), 0 0 30px var(--primary-glow);
            left: 0;
            animation: scan-login 3.5s ease-in-out infinite alternate;
            z-index: 20;
            opacity: 0.5;
            pointer-events: none;
        }
        @keyframes scan-login {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* --- UI Containers & Animations --- */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0, 229, 255, 0.1);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            animation: float-panel 6s ease-in-out infinite;
        }

        @keyframes float-panel {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Glowing Texts */
        .text-glow { text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow); color: #e0ffff; }
        .text-glow-alt { text-shadow: 0 0 10px var(--secondary-glow), 0 0 20px var(--secondary-glow); color: #f3e8ff; }

        /* Inputs & Buttons */
        .input-group { position: relative; margin-bottom: 1.5rem; z-index: 30; }
        .input-glowing {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            color: white;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .input-glowing:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.2);
            transform: scale(1.02);
        }

        .btn-glowing {
            background: linear-gradient(90deg, rgba(0,229,255,0.1), rgba(255,0,234,0.1));
            border: 2px solid var(--primary-glow);
            color: var(--primary-glow);
            text-shadow: 0 0 8px var(--primary-glow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }
        .btn-glowing:hover {
            background: var(--primary-glow);
            color: #000;
            box-shadow: 0 0 30px var(--primary-glow);
            transform: translateY(-2px);
            letter-spacing: 2px;
        }

        .choice-btn {
            background: rgba(15, 25, 45, 0.9);
            border: 2px solid rgba(0, 229, 255, 0.3);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .choice-btn:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            transform: translateY(-3px) scale(1.02);
            background: rgba(0, 229, 255, 0.1);
        }

        /* Image Display */
        .tool-image-container {
            position: relative;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px dashed rgba(255, 0, 234, 0.4);
            margin: 0 auto 20px auto;
            max-width: 450px;
            overflow: hidden; /* Added to keep corners clean */
        }
        .tool-image {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }
        .corner-bracket {
            position: absolute; width: 20px; height: 20px; border-color: var(--primary-glow); border-style: solid;
        }
        .tl { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .tr { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
        .bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
        .br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        .hidden-section { display: none !important; opacity: 0; }
        .fade-in { animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /* =========================================
           1. QUIZ DATA & QUESTIONS (4 Options)
           ========================================= */
        const quizQuestions = [
            { image: "Images/3D_Printer.png", correctTool: "3D Printer", options: ["Air Compressor", "3D Printer", "Lathe", "Drilling Machine"] },
            { image: "Images/Air_compressor.png", correctTool: "Air Compressor", options: ["Air Compressor", "Drilling Machine", "Band Saw", "Belt Sander"] },
            { image: "Images/Band_Saw.png", correctTool: "Band Saw", options: ["Scroll Saw Machine", "Coping Saw", "Band Saw", "Folding Saw"] },
            { image: "Images/Belt_Sander.png", correctTool: "Belt Sander", options: ["Belt Sander", "Hand Drill", "Lathe", "Scroll Saw Machine"] },
            { image: "Images/Coping_saw.png", correctTool: "Coping Saw", options: ["Folding Saw", "Coping Saw", "Hammers", "Band Saw"] },
            { image: "Images/Drilling_Machine.png", correctTool: "Drilling Machine", options: ["Drilling Machine", "Lathe", "Air Compressor", "3D Printer"] },
            { image: "Images/Folding_saw.png", correctTool: "Folding Saw", options: ["Coping Saw", "Pliers", "Folding Saw", "Band Saw"] },
            { image: "Images/Hammers.png", correctTool: "Hammers", options: ["Screwdrivers", "Hammers", "Wrenches", "Pliers"] },
            { image: "Images/Hand_and_Portable_Power_Tools.png", correctTool: "Hand and Portable Power Tools", options: ["Hand and Portable Power Tools", "Rulers", "Pliers", "Hammers"] },
            { image: "Images/Hand_drill.png", correctTool: "Hand Drill", options: ["Screwdrivers", "Hand Drill", "Belt Sander", "Drilling Machine"] },
            { image: "Images/Lathe.png", correctTool: "Lathe", options: ["Lathe", "Band Saw", "3D Printer", "Drilling Machine"] },
            { image: "Images/Pliers.png", correctTool: "Pliers", options: ["Wrenches", "Pliers", "Hammers", "Screwdrivers"] },
            { image: "Images/Rulers.png", correctTool: "Rulers", options: ["Rulers", "Hand Drill", "Screwdrivers", "Wrenches"] },
            { image: "Images/Screwdrivers.png", correctTool: "Screwdrivers", options: ["Pliers", "Screwdrivers", "Wrenches", "Hammers"] },
            { image: "Images/Scroll_Saw_Machine.png", correctTool: "Scroll Saw Machine", options: ["Band Saw", "Coping Saw", "Scroll Saw Machine", "Lathe"] },
            { image: "Images/Wrenches.png", correctTool: "Wrenches", options: ["Wrenches", "Pliers", "Hammers", "Screwdrivers"] }
        ];

        /* =========================================
           2. STATE VARIABLES
           ========================================= */
        window.quizState = {
            currentUser: {},
            currentQuestionIndex: 0,
            score: 0,
            timeRemaining: 600,
            timerInterval: null,
            shuffledQuestions: []
        };
        
        let db, auth, globalAppId;
        let globalLeaderboardData = []; // Store fetched database scores

        /* =========================================
           3. FIREBASE SETUP (For Database Storage)
           ========================================= */
        const initFirebase = async () => {
            try {
                if (typeof __firebase_config !== 'undefined' && typeof __app_id !== 'undefined') {
                    const firebaseConfig = JSON.parse(__firebase_config);
                    const app = initializeApp(firebaseConfig);
                    auth = getAuth(app);
                    db = getFirestore(app);
                    globalAppId = __app_id;

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        if (user) setupLeaderboardListener();
                    });
                } else {
                    console.warn("Firebase config not found. Running in local mode without cloud saves.");
                    setupMockLeaderboard();
                }
            } catch(e) {
                console.error("Firebase init error:", e);
                setupMockLeaderboard();
            }
        };

        const setupLeaderboardListener = () => {
            const leaderboardRef = collection(db, 'artifacts', globalAppId, 'public', 'data', 'quiz_scores');
            onSnapshot(query(leaderboardRef), (snapshot) => {
                globalLeaderboardData = [];
                snapshot.forEach((doc) => {
                    globalLeaderboardData.push(doc.data());
                });
                renderLeaderboard();
            }, (error) => {
                console.error("Error listening to leaderboard:", error);
            });
        };

        const saveScoreToDatabase = async (scoreData) => {
            if (db && auth && auth.currentUser) {
                try {
                    const leaderboardRef = collection(db, 'artifacts', globalAppId, 'public', 'data', 'quiz_scores');
                    await addDoc(leaderboardRef, scoreData);
                } catch(e) {
                    console.error("Error saving score:", e);
                }
            } else {
                globalLeaderboardData.push(scoreData);
                renderLeaderboard();
            }
        };

        const setupMockLeaderboard = () => {
            globalLeaderboardData = [
                { section: "702", seat: "04", name: "Chen (陳)", score: 16, timeUsed: 240 },
                { section: "704", seat: "12", name: "Lin (林)", score: 15, timeUsed: 310 },
                { section: "701", seat: "25", name: "Huang (黃)", score: 15, timeUsed: 180 }
            ];
        };

        initFirebase();

        /* =========================================
           4. QUIZ LOGIC
           ========================================= */
        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            window.quizState.currentUser = {
                section: document.getElementById('student-section').value,
                seat: document.getElementById('student-seat').value.padStart(2, '0'),
                cname: document.getElementById('student-cname').value,
                ename: document.getElementById('student-ename').value
            };

            document.getElementById('display-name').textContent = `${window.quizState.currentUser.ename} (${window.quizState.currentUser.cname})`;
            document.getElementById('display-section').textContent = window.quizState.currentUser.section;
            document.getElementById('display-seat').textContent = window.quizState.currentUser.seat;

            switchSection('login-section', 'quiz-section');

            // Setup questions
            window.quizState.shuffledQuestions = [...quizQuestions].sort(() => Math.random() - 0.5);
            
            // Start Quiz
            startTimer();
            loadQuestion();
        });

        function switchSection(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            hideEl.classList.add('hidden-section');
            hideEl.classList.remove('fade-in');
            
            setTimeout(() => {
                showEl.classList.remove('hidden-section');
                showEl.classList.add('fade-in');

                // Toggle floating tools background visibility based on active section
                if (showId === 'quiz-section') {
                    document.getElementById('floating-tools').style.opacity = '1';
                } else {
                    document.getElementById('floating-tools').style.opacity = '0';
                }
            }, 50);
        }

        function startTimer() {
            document.getElementById('timer-display').textContent = formatTime(window.quizState.timeRemaining);
            
            window.quizState.timerInterval = setInterval(() => {
                window.quizState.timeRemaining--;
                document.getElementById('timer-display').textContent = formatTime(window.quizState.timeRemaining);
                
                if (window.quizState.timeRemaining <= 60) {
                    document.getElementById('timer-display').style.color = '#ff00ea';
                    document.getElementById('timer-display').style.textShadow = '0 0 15px #ff00ea';
                }

                if (window.quizState.timeRemaining <= 0) {
                    finishQuiz(); 
                }
            }, 1000);
        }

        function loadQuestion() {
            const q = window.quizState.shuffledQuestions[window.quizState.currentQuestionIndex];
            
            document.getElementById('current-question-num').textContent = window.quizState.currentQuestionIndex + 1;
            document.getElementById('question-image').src = q.image;

            const progress = ((window.quizState.currentQuestionIndex) / quizQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // Randomize options order for the 4 options
            q.shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < 4; i++) {
                document.getElementById(`choice-text-${i}`).textContent = q.shuffledOptions[i];
            }
        }

        window.selectAnswer = function(selectedIndex) {
            const q = window.quizState.shuffledQuestions[window.quizState.currentQuestionIndex];
            const selectedText = q.shuffledOptions[selectedIndex];
            
            if (selectedText === q.correctTool) {
                window.quizState.score++;
            }

            window.quizState.currentQuestionIndex++;

            if (window.quizState.currentQuestionIndex < quizQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        };

        async function finishQuiz() {
            clearInterval(window.quizState.timerInterval);
            switchSection('quiz-section', 'result-section');

            const timeUsed = 600 - window.quizState.timeRemaining;
            
            document.getElementById('final-score').textContent = `${window.quizState.score}/${quizQuestions.length}`;
            document.getElementById('completion-time').textContent = `Time Used: ${formatTime(timeUsed)}`;

            const scoreData = {
                section: window.quizState.currentUser.section,
                seat: window.quizState.currentUser.seat,
                name: window.quizState.currentUser.ename,
                cname: window.quizState.currentUser.cname,
                score: window.quizState.score,
                timeUsed: timeUsed,
                timestamp: new Date().toISOString()
            };

            await saveScoreToDatabase(scoreData);
            
            // --- NEW: Send data to Google Sheets ---
            sendToGoogleSheets(scoreData);
        }

        /* =========================================
           NEW: GOOGLE SHEETS SYNC FUNCTION
           ========================================= */
        function sendToGoogleSheets(data) {
            // Web App URL from Google Apps Script
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaYqMWKCW-Ve_TgpFVW10G4WWmbs2EBYstzR3SIjF5yLEKdTJ3pZTWDZtoAZgFOHr7/exec";
            
            if (GOOGLE_SCRIPT_URL === "YOUR_GOOGLE_WEB_APP_URL_HERE") {
                console.log("Google Sheets link not added yet. Data not sent to sheets.");
                return;
            }

            // Send the data in the background
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                // Using text/plain prevents strict CORS blocking from browsers
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(data)
            })
            .then(response => {
                console.log("Successfully recorded to Google Sheets!");
            })
            .catch(error => {
                console.error("Error sending to Google Sheets:", error);
            });
        }

        function renderLeaderboard() {
            const sortedData = [...globalLeaderboardData].sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.timeUsed - b.timeUsed;
            });

            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (sortedData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">No scores yet.</td></tr>';
                return;
            }

            const currentUserSeatId = window.quizState.currentUser.seat ? `${window.quizState.currentUser.section}-${window.quizState.currentUser.seat}` : null;

            sortedData.forEach((entry, index) => {
                const tr = document.createElement('tr');
                const isCurrent = currentUserSeatId === `${entry.section}-${entry.seat}`;
                
                if (isCurrent) {
                    tr.className = 'bg-cyan-900 bg-opacity-40 border-l-4 border-cyan-400 transition-all';
                } else {
                    tr.className = 'hover:bg-slate-800 transition-colors duration-200';
                }

                let rankStyle = 'text-gray-400';
                if (index === 0) rankStyle = 'text-yellow-400 font-bold text-shadow-[0_0_10px_#facc15]';
                else if (index === 1) rankStyle = 'text-gray-300 font-bold text-shadow-[0_0_10px_#cbd5e1]';
                else if (index === 2) rankStyle = 'text-amber-600 font-bold text-shadow-[0_0_10px_#d97706]';

                tr.innerHTML = `
                    <td class="p-4 ${rankStyle}">#${index + 1}</td>
                    <td class="p-4 text-gray-200">${entry.section}</td>
                    <td class="p-4 text-gray-300">${entry.seat}</td>
                    <td class="p-4 font-semibold ${isCurrent ? 'text-cyan-300' : 'text-white'}">${entry.name} ${isCurrent ? '<span class="text-xs ml-2 text-cyan-500 bg-cyan-900 px-2 py-1 rounded">(YOU)</span>' : ''}</td>
                    <td class="p-4 text-right font-mono font-bold text-cyan-100">${entry.score}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
